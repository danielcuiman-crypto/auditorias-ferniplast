<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092b4c"><title>Ferniplast | Auditorías de Sistemas</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#15253c;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#082b4c,#07539b);color:white;padding:19px 20px;position:sticky;top:0;z-index:3;box-shadow:0 5px 20px #092b4c26}.wrap{max-width:1080px;margin:auto}.brand{font-weight:850;font-size:21px;letter-spacing:.4px}.sub{opacity:.8;font-size:12px}main{max-width:1080px;margin:auto;padding:20px 16px 105px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}h1{font-size:25px;margin:0 0 6px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 12px}p{line-height:1.5}.muted{color:#64748b;font-size:13px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:19px;box-shadow:0 4px 18px #15253c09;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.btn{border:0;border-radius:11px;background:#075ac5;color:white;padding:12px 17px;font-weight:750;min-height:44px}.btn.secondary{background:#e8f0fc;color:#124b88}.btn.green{background:#059669}.btn.dark{background:#0b2f51}.btn.outline{background:white;border:1px solid #cbd5e1;color:#1f3d5a}.btn:disabled{opacity:.45}.actions{display:flex;gap:9px;flex-wrap:wrap}.field{display:block;font-weight:650;font-size:13px;margin-bottom:12px}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;margin-top:6px;background:white;color:#15253c}.field textarea{min-height:85px;resize:vertical}.nav{display:flex;gap:8px;overflow:auto;padding:3px 0 12px}.pill{white-space:nowrap;border:1px solid #dbe3ef;background:#fff;border-radius:12px;padding:12px;font-weight:700;color:#244566}.pill.active{background:#075ac5;color:#fff;border-color:#075ac5}.question{padding:15px 0;border-bottom:1px solid #edf1f5}.question:last-child{border:0}.question strong{display:block;font-size:14px;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.choice{border:1px solid #d9e2ed;border-radius:10px;background:#f8fafc;color:#43566f;padding:11px 2px;font-size:12px;font-weight:750}.choice.active.Bueno{background:#d8fae7;color:#04764d;border-color:#20b775}.choice.active.Regular{background:#fff0c9;color:#9a5900;border-color:#efb52c}.choice.active.Malo{background:#ffe0e0;color:#bb2929;border-color:#e76b6b}.choice.active.NA{background:#e2e8f0;color:#475569;border-color:#94a3b8}.kpi{background:#fff;border-radius:15px;padding:18px;border:1px solid #e2e8f0}.kpi b{font-size:28px;display:block}.kpi span{font-size:12px;color:#64748b}.progress{height:10px;background:#e2e8f0;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#10b981;border-radius:20px}.status{font-size:11px;font-weight:800;border-radius:8px;padding:5px 9px;background:#e8f0fc;color:#075ac5}.status.bad{background:#fee2e2;color:#b91c1c}.status.warn{background:#fef3c7;color:#a16207}.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eef2f7}.listrow:last-child{border:0}.score{font-size:25px;font-weight:850;color:#059669}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dbe4f0;display:flex;justify-content:center;z-index:4;padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;max-width:160px;background:transparent;border:0;padding:12px 3px;color:#64748b;font-size:11px;font-weight:750}.bottom button.active{color:#075ac5}.bottom i{display:block;font-size:20px;font-style:normal;margin-bottom:4px}.notice{background:#fff7db;border:1px solid #f4d98a;padding:12px;border-radius:12px;font-size:12px;color:#805900;margin-bottom:15px}.devicehead{display:flex;justify-content:space-between;align-items:center;gap:12px}.fileinput{max-width:100%}.photo{width:80px;height:80px;object-fit:cover;border-radius:10px;margin:6px 6px 0 0}.printonly{display:none}@media(max-width:550px){main{padding:16px 12px 100px}.card{padding:15px}.hero{align-items:flex-start}.hero h1{font-size:21px}.choices{gap:4px}.choice{font-size:11px;padding:12px 1px}.btn{padding:11px 13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media print{header,.bottom,.noprint,.actions,.nav{display:none!important}body{background:white}main{padding:0}.card{box-shadow:none;break-inside:avoid}.printonly{display:block}.screenonly{display:none!important}}
</style></head><body><header><div class="wrap"><div class="brand">▥ FERNIPLAST</div><div class="sub">Auditorías de Sistemas · Control de sucursales</div></div></header><main id="app"></main><nav class="bottom noprint" id="bottom"></nav><script>
'use strict';const KEY='ferniplast_auditorias_v1';const sections=[{name:'Relevamientos',devices:[{name:'Insumos de BK',q:['Existe','Control']},{name:'Líneas Telefónicas',q:['Existe','Control']},{name:'PinPad',q:['Existe','Control']},{name:'Posnet',q:['Existe','Control']}]},{name:'Cajas',devices:Array.from({length:4},(_,i)=>({name:'Caja '+(i+1),q:['Limpieza de Comandera','Limpieza de POS','Estado del cableado y rosetas','Anclaje y estado del Scanner','Estado del teclado','Estado del sector','Estado del PinPad y Posnet','Conexión desactivador y cableado']}))},{name:'Verificadores',devices:Array.from({length:4},(_,i)=>({name:'Verificador '+(i+1),q:['Limpieza y Orden','Cableado y etiquetado','Anclaje Lector Barras']}))},{name:'Consultas',devices:Array.from({length:3},(_,i)=>({name:'Consulta '+(i+1),q:['Limpieza y Orden','Cableado y etiquetado','Anclaje Lector Barras']}))},{name:'Computadoras',devices:['PC Administrativa','PC Bolsero','PC Líder','PC Co-Líder','PC Vigilancia','PC Depósito'].map(name=>({name,q:['Limpieza y Orden','Cableado y etiquetado','Anclaje Lector Barras']}))},{name:'Impresoras',devices:['Impresora 1','Impresora 2'].map(name=>({name,q:['Estado, Limpieza y Orden','Conexión y Cableado']}))},{name:'Impresoras portátiles',devices:['Impresora Portátil 1','Impresora Portátil 2'].map(name=>({name,q:['Estado, Limpieza y Orden','Conexión y Cargador']}))},{name:'Grupo electrógeno',devices:[{name:'Grupo electrógeno',q:['Obstrucciones','Estado','Cronograma']}]},{name:'Aire acondicionado',devices:[{name:'Aire acondicionado',q:['Estado Filtro','Temperatura 23 °C','Olores']}]},{name:'Sala de Sistemas',devices:[{name:'Sala de Sistemas',q:['Puerta cerrada','Orden y Limpieza','Cableado y rosetas','Tableros cerrados','Etiquetado']}]}];
const total=sections.flatMap(s=>s.devices.flatMap(d=>d.q)).length;let records=load(),page='home',current=null,section=0,device=0,detail=null;function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){alert('No se pudo guardar. Revisá el almacenamiento del navegador y el tamaño de las fotos.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toLocaleDateString('en-CA')}function fresh(){return{id:Date.now().toString(36),branch:'Ferni 1',tech:'',date:today(),end:'',assistant:'',manager:'',closingTech:'',answers:{},notes:{},photos:{},extra:{},conclusion:'',status:'draft',created:Date.now()}}function find(){return records.find(r=>r.id===current)}function stats(r){let vals=Object.values(r.answers||{}),b=vals.filter(v=>v==='Bueno').length,reg=vals.filter(v=>v==='Regular').length,m=vals.filter(v=>v==='Malo').length,na=vals.filter(v=>v==='NA').length;return{b,reg,m,na,done:vals.length,pct:b+reg+m?Math.round(b/(b+reg+m)*1000)/10:0}}function issues(r){let a=[];sections.forEach(s=>s.devices.forEach(d=>d.q.forEach(q=>{let key=d.name+'|'+q,v=r.answers[key];if(v==='Regular'||v==='Malo')a.push({device:d.name,q,v,note:r.notes[d.name]||''})})));return a}function btn(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}function nav(){document.getElementById('bottom').innerHTML=[['home','⌂','Inicio'],['edit','⊕','Nueva'],['final','▣','Finalizadas'],['drafts','◷','Borradores']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><i>${i}</i>${t}</button>`).join('')}function render(){nav();let el=document.getElementById('app');if(page==='home'){let done=records.filter(x=>x.status==='final').length,draft=records.length-done;el.innerHTML=`<div class="hero"><div><h1>Panel de auditorías</h1><div class="muted">Evaluaciones de Sistemas · Ferniplast</div></div></div><div class="notice">Versión de prueba: los datos se guardan solamente en este navegador. No hay sincronización entre dispositivos.</div><div class="grid"><div class="kpi"><b>${done}</b><span>Auditorías finalizadas</span></div><div class="kpi"><b>${draft}</b><span>Borradores guardados</span></div></div><br><div class="grid"><div class="card"><h2>➕ Nueva auditoría</h2><p class="muted">Completá el relevamiento durante tu visita a la sucursal.</p>${btn('Comenzar auditoría','start()')}</div><div class="card"><h2>▣ Auditorías finalizadas</h2><p class="muted">Resultados, puntos a mejorar y reportes para supervisores.</p>${btn('Ver resultados',"go('final')",'green')}</div><div class="card"><h2>◷ Continuar borrador</h2><p class="muted">Retomá una visita que dejaste pendiente.</p>${btn('Ver borradores',"go('drafts')",'secondary')}</div></div>`}else if(page==='edit')renderEdit(el);else if(page==='final'||page==='drafts')renderList(el);else if(page==='detail')renderDetail(el)}function go(p){page=p;if(p==='edit'&&!find()){start();return}render();scrollTo(0,0)}function start(){let r=fresh();records.unshift(r);current=r.id;section=0;device=0;save();go('edit')}function update(field,value){let r=find();if(!r)return;r[field]=value;save()}function extra(k,v){let r=find();r.extra[k]=v;save()}function answer(k,v){let r=find();r.answers[k]=v;save();render();}function note(k,v){let r=find();r.notes[k]=v;save()}function changeSection(i){section=i;device=0;render();scrollTo(0,0)}function changeDevice(i){device=i;render();scrollTo(0,0)}function next(){if(device<sections[section].devices.length-1)device++;else if(section<sections.length-1){section++;device=0}else{section=-1}render();scrollTo(0,0)}function prev(){if(section===-1){section=sections.length-1;device=sections[section].devices.length-1}else if(device>0)device--;else if(section>0){section--;device=sections[section].devices.length-1}render();scrollTo(0,0)}function renderEdit(el){let r=find();if(!r){go('home');return}let st=stats(r);el.innerHTML=`<div class="hero"><div><h1>${r.status==='final'?'Auditoría finalizada':'Nueva auditoría'}</h1><div class="muted">${esc(r.branch)} · ${st.done}/${total} controles respondidos</div></div><span class="status">${Math.round(st.done/total*100)}% completo</span></div><div class="progress"><div style="width:${st.done/total*100}%"></div></div><br><div class="card"><h3>Datos generales</h3><div class="grid"><label class="field">Sucursal<select onchange="update('branch',this.value)">${Array.from({length:10},(_,i)=>`<option ${r.branch==='Ferni '+(i+1)?'selected':''}>Ferni ${i+1}</option>`).join('')}<option ${r.branch==='Mayorista'?'selected':''}>Mayorista</option><option ${r.branch==='Centro Logístico'?'selected':''}>Centro Logístico</option></select></label><label class="field">Técnico responsable<input value="${esc(r.tech)}" onchange="update('tech',this.value)" placeholder="Nombre y apellido"></label><label class="field">Fecha de visita<input type="date" value="${esc(r.date)}" onchange="update('date',this.value)"></label></div></div><div class="nav">${sections.map((s,i)=>`<button class="pill ${section===i?'active':''}" onclick="changeSection(${i})">${esc(s.name)}</button>`).join('')}<button class="pill ${section===-1?'active':''}" onclick="section=-1;render()">Finalización</button></div>`;if(section===-1){el.innerHTML+=`<div class="card"><h2>Finalización</h2><div class="grid"><label class="field">Fecha de finalización<input type="date" value="${esc(r.end||today())}" onchange="update('end',this.value)"></label><label class="field">Asistente<input value="${esc(r.assistant)}" onchange="update('assistant',this.value)"></label><label class="field">Encargado comercial<input value="${esc(r.manager)}" onchange="update('manager',this.value)"></label><label class="field">Técnico que finaliza<input value="${esc(r.closingTech)}" onchange="update('closingTech',this.value)"></label></div><label class="field">Conclusiones (minuta breve)<textarea onchange="update('conclusion',this.value)">${esc(r.conclusion)}</textarea></label><h3>Datos adicionales del formulario</h3>${['Cajas controladas (PV)','Verificador controlado','Consultas controladas','Impresora controlada','Ruta del archivo de red','Fecha de creación/modificación','Usuario que lo crea','Mejoras - Persona quien propone','Mejoras - Área/Sector','Mejoras - Propuesta'].map(k=>`<label class="field">${esc(k)}<input value="${esc(r.extra[k]||'')}" onchange="extra('${k.replace(/'/g,"\\'")}',this.value)"></label>`).join('')}<div class="actions">${btn('← Anterior','prev()','secondary')}${btn('Guardar borrador',"save();alert('Borrador guardado en este dispositivo')",'outline')}${btn('✓ Finalizar auditoría','finish()','green')}</div></div>`;return}let s=sections[section],d=s.devices[device];el.innerHTML+=`<div class="card"><div class="devicehead"><div><div class="muted">${esc(s.name)} · Equipo ${device+1} de ${s.devices.length}</div><h2>${esc(d.name)}</h2></div><span class="status">${d.q.filter(q=>r.answers[d.name+'|'+q]).length}/${d.q.length}</span></div><div class="nav">${s.devices.map((x,i)=>`<button class="pill ${i===device?'active':''}" onclick="changeDevice(${i})">${esc(x.name)}</button>`).join('')}</div>${d.q.map((q,i)=>{let k=d.name+'|'+q;return `<div class="question"><strong>${i+1}. ${esc(q)}</strong><div class="choices">${['Bueno','Regular','Malo','NA'].map(v=>`<button class="choice ${r.answers[k]===v?'active '+v:''}" onclick="answer('${esc(k).replace(/'/g,"\\'")}','${v}')">${v==='NA'?'N/A':v}</button>`).join('')}</div></div>`}).join('')}<label class="field" style="margin-top:18px">Observaciones del equipo<textarea placeholder="Describí cualquier problema o acción necesaria..." onchange="note('${esc(d.name).replace(/'/g,"\\'")}',this.value)">${esc(r.notes[d.name]||'')}</textarea></label><label class="field">Fotografía (opcional; se guarda en este navegador)<input class="fileinput" type="file" accept="image/*" capture="environment" onchange="addPhoto(event,'${esc(d.name).replace(/'/g,"\\'")}')"></label>${r.photos[d.name]?`<img class="photo" src="${r.photos[d.name]}" alt="Foto del equipo"><button class="btn secondary" onclick="removePhoto('${esc(d.name).replace(/'/g,"\\'")}')">Quitar foto</button>`:''}<div class="actions" style="margin-top:18px">${btn('← Anterior','prev()','secondary')}${btn('Guardar borrador',"save();alert('Borrador guardado en este dispositivo')",'outline')}${btn('Siguiente →','next()')}</div></div>`}function addPhoto(e,k){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);find().photos[k]=cv.toDataURL('image/jpeg',.6);save();render()};im.src=reader.result};reader.readAsDataURL(f)}function removePhoto(k){delete find().photos[k];save();render()}function finish(){let r=find(),s=stats(r);if(!r.tech.trim()){alert('Ingresá el técnico responsable.');return}if(!s.done){alert('Respondé al menos un control antes de finalizar.');return}if(s.done<total&&!confirm(`Quedan ${total-s.done} controles sin responder. Se excluirán del porcentaje. ¿Finalizar igualmente?`))return;r.end=r.end||today();r.status='final';save();detail=r.id;go('detail')}function renderList(el){let a=records.filter(r=>r.status===(page==='final'?'final':'draft'));el.innerHTML=`<div class="hero"><div><h1>${page==='final'?'Auditorías finalizadas':'Borradores'}</h1><div class="muted">${a.length} registro(s) en este navegador</div></div></div>${!a.length?'<div class="card"><p>No hay registros todavía.</p></div>':a.map(r=>{let s=stats(r);return `<div class="card"><div class="listrow"><div><strong>${esc(r.branch)}</strong><div class="muted">${esc(r.date)} · ${esc(r.tech||'Sin técnico')}</div><div class="muted">${s.done} controles respondidos</div></div><div class="score">${r.status==='final'?s.pct+'%':Math.round(s.done/total*100)+'%'}</div></div><div class="actions" style="margin-top:12px">${btn(r.status==='final'?'Ver resultados':'Continuar',`openRecord('${r.id}')`)}${btn('Eliminar',`deleteRecord('${r.id}')`,'outline')}</div></div>`}).join('')}`}function openRecord(id){current=id;if(records.find(x=>x.id===id)?.status==='final'){detail=id;go('detail')}else go('edit')}function deleteRecord(id){if(!confirm('¿Eliminar definitivamente esta auditoría de este navegador?'))return;records=records.filter(r=>r.id!==id);save();render()}function renderDetail(el){let r=records.find(x=>x.id===detail);if(!r){go('final');return}let s=stats(r),items=issues(r);el.innerHTML=`<div class="hero"><div><h1>Informe de auditoría</h1><div class="muted">${esc(r.branch)} · ${esc(r.date)} · ${esc(r.tech)}</div></div></div><div class="card"><h2>FERNIPLAST · Auditoría de Sistemas</h2><p class="muted">Informe para supervisores · ${esc(r.branch)}</p><div class="grid"><div class="kpi"><b style="color:#059669">${s.pct}%</b><span>Evaluación positiva</span></div><div class="kpi"><b>${s.b}</b><span>Bueno</span></div><div class="kpi"><b style="color:#ca8a04">${s.reg}</b><span>Regular</span></div><div class="kpi"><b style="color:#dc2626">${s.m}</b><span>Malo</span></div></div><br><div class="progress"><div style="width:${s.pct}%"></div></div><p class="muted">${s.done} controles respondidos · ${s.na} N/A · ${total-s.done} sin responder. Porcentaje = Bueno / (Bueno + Regular + Malo).</p></div><div class="card"><h2>Puntos a mejorar (${items.length})</h2>${items.length?items.map(x=>`<div class="listrow"><div><strong>${esc(x.device)}</strong><div class="muted">${esc(x.q)}</div>${x.note?`<div class="muted">Observación: ${esc(x.note)}</div>`:''}</div><span class="status ${x.v==='Malo'?'bad':'warn'}">${x.v}</span></div>`).join(''):'<p class="muted">No se registraron controles Regular ni Malo.</p>'}</div><div class="card"><h2>Conclusión del técnico</h2><p>${esc(r.conclusion||'Sin conclusión registrada.')}</p></div><div class="card"><h2>Detalle de respuestas</h2>${sections.map(sec=>{let rows=sec.devices.flatMap(d=>d.q.map(q=>({d:d.name,q,v:r.answers[d.name+'|'+q]}))).filter(x=>x.v);return rows.length?`<h3>${esc(sec.name)}</h3>${rows.map(x=>`<div class="listrow"><div><strong>${esc(x.d)}</strong><div class="muted">${esc(x.q)}</div></div><span class="status ${x.v==='Malo'?'bad':x.v==='Regular'?'warn':''}">${x.v==='NA'?'N/A':x.v}</span></div>`).join('')}`:''}).join('')}</div><div class="card noprint"><h3>Compartir con supervisores</h3><p class="muted">Descargá el informe como PDF desde la impresión del navegador. El correo se abrirá con el resumen preparado; el PDF se adjunta manualmente.</p><div class="actions">${btn('Descargar PDF / Imprimir','window.print()','dark')}${btn('Exportar CSV',`exportCSV('${r.id}')`,'secondary')}${btn('Abrir correo',`email('${r.id}')`)}${btn('Volver',"go('final')",'outline')}</div></div>`}function email(id){let r=records.find(x=>x.id===id),s=stats(r),items=issues(r),body=`Estimados supervisores:\n\nCompartimos los resultados de la auditoría de Sistemas de ${r.branch}, realizada el ${r.date}.\n\nEvaluación positiva: ${s.pct}%\nBueno: ${s.b} | Regular: ${s.reg} | Malo: ${s.m}\n\nPUNTOS A MEJORAR:\n${items.length?items.map(x=>'- '+x.device+' / '+x.q+': '+x.v+(x.note?' ('+x.note+')':'')).join('\n'):'Sin observaciones Regular/Malo.'}\n\nCONCLUSIÓN:\n${r.conclusion||'Sin conclusión registrada.'}\n\nSe adjunta informe PDF (adjuntar manualmente).\n\nSaludos,\nÁrea de Sistemas - Ferniplast`;location.href='mailto:?subject='+encodeURIComponent('Auditoría de Sistemas - '+r.branch+' - '+r.date)+'&body='+encodeURIComponent(body)}function exportCSV(id){let r=records.find(x=>x.id===id),rows=[['Sucursal','Fecha','Técnico','Equipo','Control','Resultado','Observaciones']];sections.forEach(sec=>sec.devices.forEach(d=>d.q.forEach(q=>rows.push([r.branch,r.date,r.tech,d.name,q,r.answers[d.name+'|'+q]||'',r.notes[d.name]||'']))));let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='auditoria_'+r.branch.replaceAll(' ','_')+'_'+r.date+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();
</script></body></html>
