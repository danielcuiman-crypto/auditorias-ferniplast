'use strict';const KEY='ferniplast_auditorias_v1';const sections=[{name:'Relevamientos',devices:[{name:'Insumos de BK',q:['Existe','Control']},{name:'Líneas Telefónicas',q:['Existe','Control']},{name:'PinPad',q:['Existe','Control']},{name:'Posnet',q:['Existe','Control']}]},{name:'Cajas',devices:Array.from({length:4},(_,i)=>({name:'Caja '+(i+1),q:['Limpieza de Comandera','Limpieza de POS','Estado del cableado y rosetas','Anclaje y estado del Scanner','Estado del teclado','Estado del sector','Estado del PinPad y Posnet','Conexión desactivador y cableado']}))},{name:'Verificadores',devices:Array.from({length:4},(_,i)=>({name:'Verificador '+(i+1),q:['Limpieza y Orden','Cableado y etiquetado','Anclaje Lector Barras']}))},{name:'Consultas',devices:Array.from({length:3},(_,i)=>({name:'Consulta '+(i+1),q:['Limpieza y Orden','Cableado y etiquetado','Anclaje Lector Barras']}))},{name:'Computadoras',devices:['PC Administrativa','PC Bolsero','PC Líder','PC Co-Líder','PC Vigilancia','PC Depósito'].map(name=>({name,q:['Limpieza y Orden','Cableado y etiquetado','Anclaje Lector Barras']}))},{name:'Impresoras',devices:['Impresora 1','Impresora 2'].map(name=>({name,q:['Estado, Limpieza y Orden','Conexión y Cableado']}))},{name:'Impresoras portátiles',devices:['Impresora Portátil 1','Impresora Portátil 2'].map(name=>({name,q:['Estado, Limpieza y Orden','Conexión y Cargador']}))},{name:'Grupo electrógeno',devices:[{name:'Grupo electrógeno',q:['Obstrucciones','Estado','Cronograma']}]},{name:'Aire acondicionado',devices:[{name:'Aire acondicionado',q:['Estado Filtro','Temperatura 23 °C','Olores']}]},{name:'Sala de Sistemas',devices:[{name:'Sala de Sistemas',q:['Puerta cerrada','Orden y Limpieza','Cableado y rosetas','Tableros cerrados','Etiquetado']}]}];
const total=sections.flatMap(s=>s.devices.flatMap(d=>d.q)).length;let records=load(),page='home',current=null,section=0,device=0,detail=null;function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){alert('No se pudo guardar. Revisá el almacenamiento del navegador y el tamaño de las fotos.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toLocaleDateString('en-CA')}function fresh(){return{id:Date.now().toString(36),branch:'Ferni 1',tech:'',date:today(),end:'',assistant:'',manager:'',closingTech:'',answers:{},notes:{},photos:{},extra:{},conclusion:'',status:'draft',created:Date.now()}}function find(){return records.find(r=>r.id===current)}function stats(r){let vals=Object.values(r.answers||{}),b=vals.filter(v=>v==='Bueno').length,reg=vals.filter(v=>v==='Regular').length,m=vals.filter(v=>v==='Malo').length,na=vals.filter(v=>v==='NA').length;return{b,reg,m,na,done:vals.length,pct:b+reg+m?Math.round(b/(b+reg+m)*1000)/10:0}}function issues(r){let a=[];sections.forEach(s=>s.devices.forEach(d=>d.q.forEach(q=>{let key=d.name+'|'+q,v=r.answers[key];if(v==='Regular'||v==='Malo')a.push({device:d.name,q,v,note:r.notes[d.name]||''})})));return a}function btn(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}function nav(){document.getElementById('bottom').innerHTML=[['home','⌂','Inicio'],['edit','⊕','Nueva'],['final','▣','Finalizadas'],['drafts','◷','Borradores']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><i>${i}</i>${t}</button>`).join('')}function render(){nav();let el=document.getElementById('app');if(page==='home'){let done=records.filter(x=>x.status==='final').length,draft=records.length-done;el.innerHTML=`<div class="hero"><div><h1>Panel de auditorías</h1><div class="muted">Evaluaciones de Sistemas · Ferniplast</div></div></div><div class="notice">Versión de prueba: los datos se guardan solamente en este navegador. No hay sincronización entre dispositivos.</div><div class="grid"><div class="kpi"><b>${done}</b><span>Auditorías finalizadas</span></div><div class="kpi"><b>${draft}</b><span>Borradores guardados</span></div></div><br><div class="grid"><div class="card"><h2>➕ Nueva auditoría</h2><p class="muted">Completá el relevamiento durante tu visita a la sucursal.</p>${btn('Comenzar auditoría','start()')}</div><div class="card"><h2>▣ Auditorías finalizadas</h2><p class="muted">Resultados, puntos a mejorar y reportes para supervisores.</p>${btn('Ver resultados',"go('final')",'green')}</div><div class="card"><h2>◷ Continuar borrador</h2><p class="muted">Retomá una visita que dejaste pendiente.</p>${btn('Ver borradores',"go('drafts')",'secondary')}</div></div>`}else if(page==='edit')renderEdit(el);else if(page==='final'||page==='drafts')renderList(el);else if(page==='detail')renderDetail(el)}function go(p){page=p;if(p==='edit'&&!find()){start();return}render();scrollTo(0,0)}function start(){let r=fresh();records.unshift(r);current=r.id;section=0;device=0;save();go('edit')}function update(field,value){let r=find();if(!r)return;r[field]=value;save()}function extra(k,v){let r=find();r.extra[k]=v;save()}function answer(k,v){let r=find();r.answers[k]=v;save();render();}function note(k,v){let r=find();r.notes[k]=v;save()}function changeSection(i){section=i;device=0;render();scrollTo(0,0)}function changeDevice(i){device=i;render();scrollTo(0,0)}function next(){if(device<sections[section].devices.length-1)device++;else if(section<sections.length-1){section++;device=0}else{section=-1}render();scrollTo(0,0)}function prev(){if(section===-1){section=sections.length-1;device=sections[section].devices.length-1}else if(device>0)device--;else if(section>0){section--;device=sections[section].devices.length-1}render();scrollTo(0,0)}function renderEdit(el){let r=find();if(!r){go('home');return}let st=stats(r);el.innerHTML=`<div class="hero"><div><h1>${r.status==='final'?'Auditoría finalizada':'Nueva auditoría'}</h1><div class="muted">${esc(r.branch)} · ${st.done}/${total} controles respondidos</div></div><span class="status">${Math.round(st.done/total*100)}% completo</span></div><div class="progress"><div style="width:${st.done/total*100}%"></div></div><br><div class="card"><h3>Datos generales</h3><div class="grid"><label class="field">Sucursal<select onchange="update('branch',this.value)">${Array.from({length:10},(_,i)=>`<option ${r.branch==='Ferni '+(i+1)?'selected':''}>Ferni ${i+1}</option>`).join('')}<option ${r.branch==='Mayorista'?'selected':''}>Mayorista</option><option ${r.branch==='Centro Logístico'?'selected':''}>Centro Logístico</option></select></label><label class="field">Técnico responsable<input value="${esc(r.tech)}" onchange="update('tech',this.value)" placeholder="Nombre y apellido"></label><label class="field">Fecha de visita<input type="date" value="${esc(r.date)}" onchange="update('date',this.value)"></label></div></div><div class="nav">${sections.map((s,i)=>`<button class="pill ${section===i?'active':''}" onclick="changeSection(${i})">${esc(s.name)}</button>`).join('')}<button class="pill ${section===-1?'active':''}" onclick="section=-1;render()">Finalización</button></div>`;if(section===-1){el.innerHTML+=`<div class="card"><h2>Finalización</h2><div class="grid"><label class="field">Fecha de finalización<input type="date" value="${esc(r.end||today())}" onchange="update('end',this.value)"></label><label class="field">Asistente<input value="${esc(r.assistant)}" onchange="update('assistant',this.value)"></label><label class="field">Encargado comercial<input value="${esc(r.manager)}" onchange="update('manager',this.value)"></label><label class="field">Técnico que finaliza<input value="${esc(r.closingTech)}" onchange="update('closingTech',this.value)"></label></div><label class="field">Conclusiones (minuta breve)<textarea onchange="update('conclusion',this.value)">${esc(r.conclusion)}</textarea></label><h3>Datos adicionales del formulario</h3>${['Cajas controladas (PV)','Verificador controlado','Consultas controladas','Impresora controlada','Ruta del archivo de red','Fecha de creación/modificación','Usuario que lo crea','Mejoras - Persona quien propone','Mejoras - Área/Sector','Mejoras - Propuesta'].map(k=>`<label class="field">${esc(k)}<input value="${esc(r.extra[k]||'')}" onchange="extra('${k.replace(/'/g,"\\'")}',this.value)"></label>`).join('')}<div class="actions">${btn('← Anterior','prev()','secondary')}${btn('Guardar borrador',"syncCurrent()",'outline')}${btn('✓ Finalizar auditoría','finish()','green')}</div></div>`;return}let s=sections[section],d=s.devices[device];el.innerHTML+=`<div class="card"><div class="devicehead"><div><div class="muted">${esc(s.name)} · Equipo ${device+1} de ${s.devices.length}</div><h2>${esc(d.name)}</h2></div><span class="status">${d.q.filter(q=>r.answers[d.name+'|'+q]).length}/${d.q.length}</span></div><div class="nav">${s.devices.map((x,i)=>`<button class="pill ${i===device?'active':''}" onclick="changeDevice(${i})">${esc(x.name)}</button>`).join('')}</div>${d.q.map((q,i)=>{let k=d.name+'|'+q;return `<div class="question"><strong>${i+1}. ${esc(q)}</strong><div class="choices">${['Bueno','Regular','Malo','NA'].map(v=>`<button class="choice ${r.answers[k]===v?'active '+v:''}" onclick="answer('${esc(k).replace(/'/g,"\\'")}','${v}')">${v==='NA'?'N/A':v}</button>`).join('')}</div></div>`}).join('')}<label class="field" style="margin-top:18px">Observaciones del equipo<textarea placeholder="Describí cualquier problema o acción necesaria..." onchange="note('${esc(d.name).replace(/'/g,"\\'")}',this.value)">${esc(r.notes[d.name]||'')}</textarea></label><label class="field">Fotografía (opcional; se guarda en este navegador)<input class="fileinput" type="file" accept="image/*" capture="environment" onchange="addPhoto(event,'${esc(d.name).replace(/'/g,"\\'")}')"></label>${r.photos[d.name]?`<img class="photo" src="${r.photos[d.name]}" alt="Foto del equipo"><button class="btn secondary" onclick="removePhoto('${esc(d.name).replace(/'/g,"\\'")}')">Quitar foto</button>`:''}<div class="actions" style="margin-top:18px">${btn('← Anterior','prev()','secondary')}${btn('Guardar borrador',"syncCurrent()",'outline')}${btn('Siguiente →','next()')}</div></div>`}function addPhoto(e,k){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);find().photos[k]=cv.toDataURL('image/jpeg',.6);save();render()};im.src=reader.result};reader.readAsDataURL(f)}function removePhoto(k){delete find().photos[k];save();render()}function finish(){let r=find(),s=stats(r);if(!r.tech.trim()){alert('Ingresá el técnico responsable.');return}if(!s.done){alert('Respondé al menos un control antes de finalizar.');return}if(s.done<total&&!confirm(`Quedan ${total-s.done} controles sin responder. Se excluirán del porcentaje. ¿Finalizar igualmente?`))return;r.end=r.end||today();r.status='final';save();detail=r.id;go('detail')}function renderList(el){let a=records.filter(r=>r.status===(page==='final'?'final':'draft'));el.innerHTML=`<div class="hero"><div><h1>${page==='final'?'Auditorías finalizadas':'Borradores'}</h1><div class="muted">${a.length} registro(s) en este navegador</div></div></div>${!a.length?'<div class="card"><p>No hay registros todavía.</p></div>':a.map(r=>{let s=stats(r);return `<div class="card"><div class="listrow"><div><strong>${esc(r.branch)}</strong><div class="muted">${esc(r.date)} · ${esc(r.tech||'Sin técnico')}</div><div class="muted">${s.done} controles respondidos</div></div><div class="score">${r.status==='final'?s.pct+'%':Math.round(s.done/total*100)+'%'}</div></div><div class="actions" style="margin-top:12px">${btn(r.status==='final'?'Ver resultados':'Continuar',`openRecord('${r.id}')`)}${btn('Eliminar',`deleteRecord('${r.id}')`,'outline')}</div></div>`}).join('')}`}function openRecord(id){current=id;if(records.find(x=>x.id===id)?.status==='final'){detail=id;go('detail')}else go('edit')}function deleteRecord(id){if(!confirm('¿Eliminar definitivamente esta auditoría de este navegador?'))return;records=records.filter(r=>r.id!==id);save();render()}function renderDetail(el){let r=records.find(x=>x.id===detail);if(!r){go('final');return}let s=stats(r),items=issues(r);el.innerHTML=`<div class="hero"><div><h1>Informe de auditoría</h1><div class="muted">${esc(r.branch)} · ${esc(r.date)} · ${esc(r.tech)}</div></div></div><div class="card"><h2>FERNIPLAST · Auditoría de Sistemas</h2><p class="muted">Informe para supervisores · ${esc(r.branch)}</p><div class="grid"><div class="kpi"><b style="color:#059669">${s.pct}%</b><span>Evaluación positiva</span></div><div class="kpi"><b>${s.b}</b><span>Bueno</span></div><div class="kpi"><b style="color:#ca8a04">${s.reg}</b><span>Regular</span></div><div class="kpi"><b style="color:#dc2626">${s.m}</b><span>Malo</span></div></div><br><div class="progress"><div style="width:${s.pct}%"></div></div><p class="muted">${s.done} controles respondidos · ${s.na} N/A · ${total-s.done} sin responder. Porcentaje = Bueno / (Bueno + Regular + Malo).</p></div><div class="card"><h2>Puntos a mejorar (${items.length})</h2>${items.length?items.map(x=>`<div class="listrow"><div><strong>${esc(x.device)}</strong><div class="muted">${esc(x.q)}</div>${x.note?`<div class="muted">Observación: ${esc(x.note)}</div>`:''}</div><span class="status ${x.v==='Malo'?'bad':'warn'}">${x.v}</span></div>`).join(''):'<p class="muted">No se registraron controles Regular ni Malo.</p>'}</div><div class="card"><h2>Conclusión del técnico</h2><p>${esc(r.conclusion||'Sin conclusión registrada.')}</p></div><div class="card"><h2>Detalle de respuestas</h2>${sections.map(sec=>{let rows=sec.devices.flatMap(d=>d.q.map(q=>({d:d.name,q,v:r.answers[d.name+'|'+q]}))).filter(x=>x.v);return rows.length?`<h3>${esc(sec.name)}</h3>${rows.map(x=>`<div class="listrow"><div><strong>${esc(x.d)}</strong><div class="muted">${esc(x.q)}</div></div><span class="status ${x.v==='Malo'?'bad':x.v==='Regular'?'warn':''}">${x.v==='NA'?'N/A':x.v}</span></div>`).join('')}`:''}).join('')}</div><div class="card noprint"><h3>Compartir con supervisores</h3><p class="muted">Descargá el informe como PDF desde la impresión del navegador. El correo se abrirá con el resumen preparado; el PDF se adjunta manualmente.</p><div class="actions">${btn('Descargar PDF / Imprimir','protectedPrint()','dark')}${btn('Exportar CSV',`protectedCSV('${r.id}')`,'secondary')}${btn('Abrir correo',`protectedEmail('${r.id}')`)}${btn('Volver',"go('final')",'outline')}</div></div>`}function email(id){let r=records.find(x=>x.id===id),s=stats(r),items=issues(r),body=`Estimados supervisores:\n\nCompartimos los resultados de la auditoría de Sistemas de ${r.branch}, realizada el ${r.date}.\n\nEvaluación positiva: ${s.pct}%\nBueno: ${s.b} | Regular: ${s.reg} | Malo: ${s.m}\n\nPUNTOS A MEJORAR:\n${items.length?items.map(x=>'- '+x.device+' / '+x.q+': '+x.v+(x.note?' ('+x.note+')':'')).join('\n'):'Sin observaciones Regular/Malo.'}\n\nCONCLUSIÓN:\n${r.conclusion||'Sin conclusión registrada.'}\n\nSe adjunta informe PDF (adjuntar manualmente).\n\nSaludos,\nÁrea de Sistemas - Ferniplast`;location.href='mailto:?subject='+encodeURIComponent('Auditoría de Sistemas - '+r.branch+' - '+r.date)+'&body='+encodeURIComponent(body)}function exportCSV(id){let r=records.find(x=>x.id===id),rows=[['Sucursal','Fecha','Técnico','Equipo','Control','Resultado','Observaciones']];sections.forEach(sec=>sec.devices.forEach(d=>d.q.forEach(q=>rows.push([r.branch,r.date,r.tech,d.name,q,r.answers[d.name+'|'+q]||'',r.notes[d.name]||'']))));let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='auditoria_'+r.branch.replaceAll(' ','_')+'_'+r.date+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

const API='https://ferniplast-auditorias-api.daniel-cuiman.workers.dev';
let accessToken=sessionStorage.getItem('ferniplast_report_token')||'';
let syncing=false;
const localRender=render;
const localStart=start;
const localGo=go;
async function authorizeReport(){
  if(accessToken){
    try{await api('/report-access');return true}
    catch(e){accessToken='';sessionStorage.removeItem('ferniplast_report_token')}
  }
  const password=prompt('Contraseña de Sistemas para descargar o enviar informes:');
  if(password===null)return false;
  if(!password){alert('Ingresá una contraseña.');return false}
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
    const d=await r.json();
    if(!r.ok||!d.token)throw Error('Contraseña incorrecta.');
    accessToken=d.token;
    sessionStorage.setItem('ferniplast_report_token',accessToken);
    return true;
  }catch(e){alert('No se habilitaron los informes: '+e.message);return false}
}
async function protectedPrint(){if(await authorizeReport())window.print()}
async function protectedCSV(id){if(await authorizeReport())exportCSV(id)}
async function protectedEmail(id){if(await authorizeReport())email(id)}
async function api(path,options={}){
  let res=await fetch(API+path,{...options,headers:{'Content-Type':'application/json',...(accessToken?{'Authorization':'Bearer '+accessToken}:{}),...(options.headers||{})}});
  let data=await res.json().catch(()=>({}));
  if(res.status===401)throw Error('La autorización para informes venció');
  if(!res.ok||!data.ok)throw Error(data.error||'Error de conexión con el servidor');
  return data;
}
function serverRecord(a){return {id:String(a.id??a.ID),branch:a.sucursal??a.SUCURSAL,tech:a.tecnico??a.TECNICO,date:a.fecha_visita??a.FECHA_VISITA,end:'',assistant:'',manager:'',closingTech:'',answers:{},notes:{},photos:{},extra:{},conclusion:'',status:(a.estado??a.ESTADO)==='FINALIZADA'?'final':'draft',created:Date.now(),remote:true,loaded:false}}
async function refreshRemote(){
  const d=await api('/auditorias');
  const local=records.filter(r=>!r.remote);
  records=[...local,...d.auditorias.map(a=>{
    const old=records.find(r=>r.remote&&r.id===String(a.id));
    return old?.loaded?old:serverRecord(a);
  })];
  save();
}
async function loadRemote(id){
  const d=await api('/auditorias/'+id),a=d.auditoria;
  const r=serverRecord(a);r.end=a.FECHA_FINALIZACION?.slice(0,10)||'';
  r.assistant=a.ASISTENTE||'';r.manager=a.ENCARGADO_COMERCIAL||'';
  r.conclusion=a.CONCLUSION||'';r.loaded=true;
  for(const x of d.respuestas){let k=x.EQUIPO+'|'+x.PREGUNTA;r.answers[k]=x.RESPUESTA==='N/A'?'NA':x.RESPUESTA||'';if(x.OBSERVACION)r.notes[x.EQUIPO]=x.OBSERVACION}
  const i=records.findIndex(x=>x.id===String(id));if(i>=0)records[i]=r;else records.unshift(r);
  save();return r;
}
function payload(r){
  const respuestas=[];
  sections.forEach(s=>s.devices.forEach(d=>d.q.forEach(q=>{
    const k=d.name+'|'+q,v=r.answers[k];
    if(v)respuestas.push({seccion:s.name,equipo:d.name,pregunta:q,respuesta:v==='NA'?'N/A':v,observacion:r.notes[d.name]||''});
  })));
  return {id:r.remote?Number(r.id):null,sucursal:r.branch,tecnico:r.tech,fecha_visita:r.date,estado:r.status==='final'?'FINALIZADA':'BORRADOR',asistente:r.assistant,encargado_comercial:r.manager,conclusion:r.conclusion,respuestas};
}
async function syncCurrent(showMessage=true){
  const r=find();if(!r||syncing)return false;
  if(!r.tech.trim()){alert('Ingresá el técnico responsable antes de guardar en la nube.');return false}
  syncing=true;
  try{
    const d=await api('/auditorias',{method:'POST',body:JSON.stringify(payload(r))});
    const oldId=r.id;r.id=String(d.id);r.remote=true;r.loaded=true;
    if(current===oldId)current=r.id;if(detail===oldId)detail=r.id;
    save();if(showMessage)alert('Auditoría guardada en Cloudflare D1.');return true;
  }catch(e){alert('No se pudo guardar en D1: '+e.message+'\nLos cambios siguen en este navegador.');return false}
  finally{syncing=false}
}
render=function(){
  localRender();
  if(page==='home'){
    let notice=document.querySelector('.notice');
    if(notice)notice.textContent='Guardá cada borrador con el botón “Guardar borrador” para sincronizarlo con Cloudflare D1. Las fotos aún permanecen solo en este dispositivo.';
    const hero=document.querySelector('.hero');
    if(hero)hero.insertAdjacentHTML('beforeend','<div class="actions"><button class="btn secondary" onclick="reloadCloud()">Actualizar nube</button></div>');
  }
  if(page==='edit'){
    const r=find();if(r?.status==='final'){
      document.querySelectorAll('input,select,textarea,.choice').forEach(x=>x.disabled=true);
    }
  }
};
async function reloadCloud(){try{await refreshRemote();render();alert('Lista actualizada desde D1.')}catch(e){alert(e.message)}}

openRecord=async function(id){
  try{
    const r=records.find(x=>x.id===String(id));
    if(r?.remote&&!r.loaded)await loadRemote(id);
    current=String(id);
    if(find()?.status==='final'){detail=current;go('detail')}else go('edit');
  }catch(e){alert('No se pudo abrir la auditoría: '+e.message)}
};
finish=async function(){
  let r=find(),s=stats(r);
  if(!r.tech.trim()){alert('Ingresá el técnico responsable.');return}
  if(!s.done){alert('Respondé al menos un control antes de finalizar.');return}
  if(s.done<total&&!confirm(`Quedan ${total-s.done} controles sin responder. Se excluirán del porcentaje. ¿Finalizar igualmente?`))return;
  r.end=r.end||today();r.status='final';save();
  if(!await syncCurrent(false)){r.status='draft';save();return}
  detail=r.id;go('detail');alert('Auditoría finalizada y guardada en Cloudflare D1.');
};
deleteRecord=function(id){
  let r=records.find(x=>x.id===String(id));
  if(r?.remote){alert('Para proteger los datos, no está habilitado eliminar auditorías guardadas en D1.');return}
  if(!confirm('¿Eliminar este borrador local?'))return;
  records=records.filter(x=>x.id!==String(id));save();render();
};
// Validate token before showing locally cached audit data.
(async()=>{try{await refreshRemote();render()}catch(e){console.warn('No se pudo cargar D1:',e);render();alert('No se pudo conectar con Cloudflare D1. Los datos locales siguen disponibles.')}})();

</script></body></html>
